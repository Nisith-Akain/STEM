<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neutralization Reactions</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --code:#f6f8fa; --accent:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --code:#151b23; --accent:#4493f8; }
  }
  body { background:var(--bg); color:var(--fg); margin:0; font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px; }
  h1 { border-bottom:1px solid var(--line); padding-bottom:.3em; }
  h2 { border-bottom:1px solid var(--line); padding-bottom:.3em; margin-top:1.8em; }
  a { color:var(--accent); }
  code, pre { background:var(--code); border-radius:6px; }
  code { padding:.15em .35em; }
  pre { padding:12px 16px; overflow-x:auto; }
  pre code { padding:0; }
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; margin:1em 0; width:100%; }
  th, td { border:1px solid var(--line); padding:6px 12px; text-align:left; }
  th { background:var(--code); }
  .katex-display { overflow-x:auto; overflow-y:hidden; }
  h1 { margin-top:0; }
  .tabs { display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:24px; position:sticky; top:0; background:var(--bg); padding-top:8px; z-index:1; scrollbar-width:thin; }
  .tab { flex:none; background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); font:inherit; font-size:.92em; padding:8px 12px; cursor:pointer; white-space:nowrap; }
  .tab:hover { color:var(--fg); }
  .tab[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--accent); font-weight:600; }
  .tab:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .pager { display:flex; justify-content:space-between; gap:12px; margin-top:2.5em; }
  .pager button { background:var(--code); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  .pager button:hover { border-color:var(--accent); }
  footer { margin-top:3em; color:var(--muted); font-size:.9em; }
</style>
</head>
<body>
<main>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <article id="content">Loading…</article>
  <footer><a href="https://github.com/Nisith-Akain/STEM">STEM on GitHub</a></footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
(async () => {
  const el = document.getElementById('content'), nav = document.getElementById('tabs');
  const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  try {
    const res = await fetch('chemistry/neutralization-reactions.md');
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    // Split into one tab per "## " section; text before the first one is the Overview
    const parts = text.split(/^(?=## )/m);
    const tabs = parts.map((md, i) => {
      const title = i === 0 ? 'Overview' : md.match(/^## (.*)/)[1].replace(/^\d+\.\s*/, '');
      return { title, id: i === 0 ? 'overview' : slug(title), md };
    });
    let current = -1;
    const show = (i, push = true) => {
      i = Math.max(0, Math.min(tabs.length - 1, i));
      current = i;
      el.innerHTML = marked.parse(tabs[i].md);
      el.querySelectorAll('pre > code.language-latex').forEach(code => {
        const div = document.createElement('div');
        katex.render(code.textContent.trim(), div, { displayMode: true, throwOnError: false });
        code.parentElement.replaceWith(div);
      });
      el.querySelectorAll('table').forEach(t => {
        const w = document.createElement('div'); w.className = 'table-wrap';
        t.replaceWith(w); w.appendChild(t);
      });
      const pager = document.createElement('div'); pager.className = 'pager';
      const mk = (label, j) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => go(j); return b; };
      pager.append(i > 0 ? mk('← ' + tabs[i-1].title, i-1) : document.createElement('span'),
                   i < tabs.length-1 ? mk(tabs[i+1].title + ' →', i+1) : document.createElement('span'));
      el.appendChild(pager);
      [...nav.children].forEach((b, k) => { b.setAttribute('aria-selected', k === i); b.tabIndex = k === i ? 0 : -1; });
      nav.children[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });
      document.title = tabs[i].title + ' · Neutralization Reactions';
      window.scrollTo(0, 0);
    };
    const go = i => { history.replaceState(null, '', '#' + tabs[i].id); show(i); };
    tabs.forEach((t, i) => {
      const b = document.createElement('button');
      b.className = 'tab'; b.role = 'tab'; b.textContent = t.title; b.onclick = () => go(i);
      b.onkeydown = e => {
        if (e.key === 'ArrowRight') { go(i + 1); nav.children[current].focus(); }
        if (e.key === 'ArrowLeft') { go(i - 1); nav.children[current].focus(); }
      };
      nav.appendChild(b);
    });
    const fromHash = () => { const k = tabs.findIndex(t => t.id === location.hash.slice(1)); show(k < 0 ? 0 : k); };
    window.addEventListener('hashchange', fromHash);
    fromHash();
  } catch (e) {
    el.textContent = 'Could not load the page (' + e.message + ').';
  }
})();
</script>
</body>
</html>
